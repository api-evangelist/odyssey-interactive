aid: odyssey-interactive
name: Odyssey Interactive
description: >-
  Odyssey Interactive is an independent game development studio focused on
  building free-to-play, cross-platform, competitive titles set in bright,
  hopeful, anime-inspired IP. The studio is best known for Omega Strikers, a
  free-to-play competitive arena game, and its mission is to "ignite the spark
  of competitiveness that lives within everyone" by creating community-driven
  games with longevity. Odyssey Interactive was surfaced as a portfolio company
  of a16z and added to the API Evangelist network. As of this enrichment pass
  the studio publishes no public developer API, API documentation, or developer
  portal — its public surface is its marketing site, a Verified Creators
  program, downloadable game asset kits, and a Zendesk-hosted player support
  center. This profile captures the studio's identity and verified public links.
